# AI Code Auditor - Gitleaks configuration for files matching the path condition of
# the default rule 'kubernetes-secret-yaml' (Stage 4a, D-043).
#
# On stdin Gitleaks has no file name, so its path-conditioned rules never apply. This
# file adds a verbatim copy of that rule from the pinned Gitleaks 8.30.1 default config,
# with the id prefixed and the `path` line removed. The auditor uses this file only for
# files whose relative path matches the original path regex. A test checks the copy
# against the rule embedded in the pinned binary.
title = "ai-code-auditor gitleaks config (path rule)"

[extend]
useDefault = true

[[rules]]
id = "auditor-pathless-kubernetes-secret-yaml"
description = "Possible Kubernetes Secret detected, posing a risk of leaking credentials/tokens from your deployments"
regex = '''(?i)(?:\bkind:[ \t]*["']?\bsecret\b["']?(?s:.){0,200}?\bdata:(?s:.){0,100}?\s+([\w.-]+:(?:[ \t]*(?:\||>[-+]?)\s+)?[ \t]*(?:["']?[a-z0-9+/]{10,}={0,3}["']?|\{\{[ \t\w"|$:=,.-]+}}|""|''))|\bdata:(?s:.){0,100}?\s+([\w.-]+:(?:[ \t]*(?:\||>[-+]?)\s+)?[ \t]*(?:["']?[a-z0-9+/]{10,}={0,3}["']?|\{\{[ \t\w"|$:=,.-]+}}|""|''))(?s:.){0,200}?\bkind:[ \t]*["']?\bsecret\b["']?)'''
keywords = ["secret"]
[[rules.allowlists]]
regexes = [
    '''[\w.-]+:(?:[ \t]*(?:\||>[-+]?)\s+)?[ \t]*(?:\{\{[ \t\w"|$:=,.-]+}}|""|'')''',
]
[[rules.allowlists]]
regexTarget = "match"
regexes = [
    '''(kind:(?s:.)+\n---\n(?s:.)+\bdata:|data:(?s:.)+\n---\n(?s:.)+\bkind:)''',
]
