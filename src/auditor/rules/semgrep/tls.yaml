rules:
  - id: auditor.python.tls.verification-disabled
    languages: [python]
    severity: ERROR
    message: >-
      TLS certificate or hostname verification is disabled. Traffic can be intercepted by a
      man-in-the-middle.
    metadata:
      category: security
      auditor_group: tls
      auditor_severity: HIGH
      auditor_recommendation: >-
        Keep verification enabled. For private CAs pass the CA bundle (verify="/path/ca.pem")
        instead of disabling verification.
      cwe: ["CWE-295: Improper Certificate Validation"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      references: ["https://cwe.mitre.org/data/definitions/295.html"]
    pattern-either:
      - pattern: requests.$METHOD(..., verify=False, ...)
      - pattern: httpx.$METHOD(..., verify=False, ...)
      - pattern: httpx.Client(..., verify=False, ...)
      - pattern: httpx.AsyncClient(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
      - pattern: $CTX.check_hostname = False
      - pattern: $CTX.verify_mode = ssl.CERT_NONE
